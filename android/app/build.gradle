plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// v0.47.15 "the spare": the phone already carries ffmpeg in nativeLibraryDir,
// so the on-demand fetcher (src/suravidl_engine/tools.py) is desktop-only and
// must not ship. Chaquopy 3.11 has no per-file exclude, so the engine is
// staged into the build directory without it and Chaquopy reads that copy.
def stagedPythonDir = layout.buildDirectory.dir('staged-python').get().asFile
def stageAndroidEngine = tasks.register('stageAndroidEngine', Sync) {
    from('../../src') {
        include 'suravidl_engine/**'
        exclude 'suravidl_engine/tools.py'
        // a stray tools.cpython-*.pyc (a local test run leaves one) would
        // smuggle the module straight back in
        exclude 'suravidl_engine/__pycache__/**'
        exclude '**/*.pyc'
    }
    into stagedPythonDir
}
tasks.named('preBuild').configure { dependsOn(stageAndroidEngine) }
// Chaquopy's merge<variant>PythonSources reads the staged directory, so Gradle
// must be told the order explicitly — preBuild alone is not an ancestor of it
// (that is what failed v0.47.15's first board: "uses this output of task
// ':app:stageAndroidEngine' without declaring a dependency")
tasks.configureEach { t ->
    // every Chaquopy task that could read the sources: merge*PythonSources,
    // generate*PythonSources, *PythonAssets — one rule instead of guessing
    // which one Gradle validates first
    if (t.name.toLowerCase().contains('python')) {
        t.dependsOn(stageAndroidEngine)
    }
}

android {
    namespace 'com.suravidl.app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId "com.suravidl.app"
        minSdk 24
        targetSdk 35
        versionCode 171
        versionName "0.47.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            // CI-only: keystore path arrives via repo secrets / env.
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias "suravidl"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            // v0.47.15 "the spare": the engine is staged so the APK carries
            // no ffmpeg *fetcher* — the phone's ffmpeg already ships in
            // nativeLibraryDir, so tools.py is desktop-only. Chaquopy 3.11
            // has no per-file exclude, hence the Sync copy.
            python.srcDir stagedPythonDir
        }
    }

    packaging {
        jniLibs {
            // The bundled ffmpeg must be exec'd from nativeLibraryDir, which
            // requires the APK to actually extract jniLibs. Modern default
            // (extractNativeLibs=false) keeps them mmapped inside the APK and
            // leaves nativeLibraryDir without the files.
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython "python3.11"
        // engine serves its web UI from Path(__file__)/web — needs real files
        extractPackages("suravidl_engine")
        pip {
            install "yt-dlp"
            // Chaquopy's wheel repo has no pydantic-core, so Android pins the
            // last fastapi that uses pure-python pydantic v1.
            install "fastapi==0.99.1"
            install "pydantic>=1.10.13,<2"
            install "uvicorn==0.23.2"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.17.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.webkit:webkit:1.17.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.0'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
}