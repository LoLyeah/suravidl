plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.suravidl.app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId "com.suravidl.app"
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName "0.19.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            // CI-only: keystore path arrives via repo secrets / env.
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias "suravidl"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            python.srcDir '../../src'   // bundle suravidl_engine as-is
        }
    }

    packaging {
        jniLibs {
            // The bundled ffmpeg must be exec'd from nativeLibraryDir, which
            // requires the APK to actually extract jniLibs. Modern default
            // (extractNativeLibs=false) keeps them mmapped inside the APK and
            // leaves nativeLibraryDir without the files.
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython "python3.11"
        // engine serves its web UI from Path(__file__)/web — needs real files
        extractPackages("suravidl_engine")
        pip {
            install "yt-dlp"
            // Chaquopy's wheel repo has no pydantic-core, so Android pins the
            // last fastapi that uses pure-python pydantic v1.
            install "fastapi==0.99.1"
            install "pydantic>=1.10.13,<2"
            install "uvicorn==0.23.2"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.0'
    androidTestImplementation 'junit:junit:4.13.2'
}