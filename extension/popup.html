<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
          <path d="M 62 8 H 194 A 54 54 0 0 1 248 62 V 194 A 54 54 0 0 1 194 248 H 62 A 54 54 0 0 1 8 194 V 62 A 54 54 0 0 1 62 8 Z" fill="var(--mark-tile)"/>
          <path d="M 90 48 H 166 A 12 12 0 0 1 178 60 V 160 H 216 L 128 224 L 40 160 H 78 V 60 A 12 12 0 0 1 90 48 Z M 104 71 L 104 137 Q 104 148 113 141.6 L 157 110.4 Q 166 104 157 97.6 L 113 66.4 Q 104 60 104 71 Z" fill="var(--mark-arrow)" fill-rule="evenodd"/>
        </svg>
        <span class="word">suravidl</span>
        <span class="engine" id="engine"><span class="led"></span><span id="engineText">checking…</span></span>
      </header>

      <section class="plate" id="found" hidden>
        <div class="site" id="site" hidden>
          <img id="favicon" alt="" width="16" height="16" src="icons/icon16.png" hidden />
          <span id="hostline"></span>
        </div>
        <h1 id="headline"></h1>
        <p class="sub" id="subline"></p>
        <div class="pickgroup" id="pickgroup" hidden>
          <div class="lbl" id="pickLabel">which stream</div>
          <div class="streams" id="streams" role="radiogroup" aria-labelledby="pickLabel"></div>
        </div>
        <button class="send" id="send">Choose quality in suravidl</button>
      </section>

      <section class="plate quiet" id="empty" hidden>
        <h1>Nothing playing yet</h1>
        <p class="sub">If this page has a video, play it for a moment, then press Check again.</p>
        <button class="ghost" id="rescan">Check again</button>
      </section>

      <section class="plate quiet" id="down" hidden>
        <h1>suravidl isn’t running</h1>
        <p class="sub">Open the suravidl app, then try again.</p>
        <button class="ghost" id="retry">Try again</button>
      </section>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>

    <footer>
      <a href="#" id="optsLink">Engine settings…</a>
      <span class="ver" id="ver">v0.5.4</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
