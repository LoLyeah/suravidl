<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>body { font: 13px system-ui; width: 380px; padding: 12px; }
      input { width: 100%; margin: 4px 0 12px; }</style>
  </head>
  <body>
    <h3>suravidl engine</h3>
    <label for="engineUrl" data-i18n="Engine URL">Engine URL</label>
    <input id="engineUrl" placeholder="http://127.0.0.1:8787" />
    <label for="engineToken" data-i18n="API token">API token</label>
    <input id="engineToken" type="password" placeholder="from suravidl → Settings → Authentication" data-i18n-ph="from suravidl → Settings → Authentication" />
    <button id="save" data-i18n="Save">Save</button>
    <div id="msg"></div>
    <p style="margin:12px 0 0; font-size:12px; color:#666;">
      <span data-i18n="Not installed yet?">Not installed yet?</span>
      <a href="https://github.com/LoLyeah/suravidl#install" target="_blank" rel="noopener"
         data-i18n="Get suravidl from GitHub ↗">Get suravidl from GitHub ↗</a>
    </p>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
