name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest tests/ -q -n auto

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax-check extension JS (parses = catches template-literal bugs)
        run: |
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/options.js
      - name: Run the extension harness (background + popup, Firefox flavor included)
        run: node extension/test_harness.mjs
      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json')); JSON.parse(require('fs').readFileSync('extension/firefox/manifest.json')); console.log('manifests OK')"
