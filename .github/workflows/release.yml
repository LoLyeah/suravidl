name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: suravidl
            files: suravidl-linux-x64.AppImage
          - os: windows-2022
            binary: suravidl.exe
            files: suravidl-windows-x64.exe
          - os: macos-14
            binary: suravidl
            files: suravidl-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install . pyinstaller pystray pillow pywebview
      - name: Build macOS app icon
        if: matrix.os == 'macos-14'
        run: |
          mkdir -p app.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/logo.png --out app.iconset/icon_${s}x${s}.png 2>/dev/null || {
              mkdir -p app.iconset
              sips -z $s $s assets/logo.png --out app.iconset/icon_${s}x${s}.png
            }
          done
          sips -z 1024 1024 assets/logo.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/icon.icns
      - name: Patch spec icon (macOS)
        if: matrix.os == 'macos-14'
        run: sed -i '' 's#assets/logo.png#assets/icon.icns#' suravidl.spec
      - name: Build binary
        run: pyinstaller suravidl.spec --noconfirm
      - name: Ad-hoc sign (macOS arm64 needs it to run)
        if: matrix.os == 'macos-14'
        run: |
          codesign --force -s - dist/suravidl
          codesign --force -s - --deep dist/suravidl.app
      - name: Smoke test frozen binary
        run: ./dist/${{ matrix.binary }} --selftest --download-dir ./smoke_dl
      - name: Package
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            ubuntu-22.04)
              cp dist/suravidl suravidl-linux-x64
              sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools
              ./scripts/build_appimage.sh dist/suravidl suravidl-linux-x64.AppImage
              ;;
            macos-14)
              cp dist/suravidl suravidl-macos-arm64
              mkdir -p dmg_stage
              cp -R dist/suravidl.app dmg_stage/
              ln -s /Applications dmg_stage/Applications
              hdiutil create -volname suravidl -srcfolder dmg_stage \
                -ov -format UDZO suravidl-macos-arm64.dmg
              ;;
            windows-2022)
              cp dist/suravidl.exe suravidl-windows-x64.exe
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}

  extension:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Chrome .crx (signed) + Firefox .xpi + source zips
        run: |
          set -e
          echo "${{ secrets.CHROME_EXT_KEY_B64 }}" | base64 -d > /tmp/ext-key.pem
          # Chrome crx3 via Chrome's own packer (stable extension ID from the key)
          xvfb-run -a google-chrome --pack-extension="$PWD/extension" \
            --pack-extension-key=/tmp/ext-key.pem --no-sandbox || \
            google-chrome --pack-extension="$PWD/extension" \
              --pack-extension-key=/tmp/ext-key.pem --no-sandbox
          mv extension.crx suravidl-extension-chrome.crx
          # Firefox build dir: MV2 manifest + shared files
          rm -rf /tmp/ffext && cp -r extension /tmp/ffext
          rm -rf /tmp/ffext/firefox
          cp extension/firefox/manifest.json /tmp/ffext/manifest.json
          # unsigned xpi (stable Firefox needs an AMO-signed build to install)
          (cd /tmp/ffext && zip -qr "$OLDPWD/suravidl-extension-firefox.xpi" .)
          # load-unpacked convenience zips
          (cd extension && zip -qr "$OLDPWD/suravidl-extension-chrome.zip" . -x "firefox/*")
          (cd /tmp/ffext && zip -qr "$OLDPWD/suravidl-extension-firefox-src.zip" .)
          # sanity: crx3 magic
          head -c 4 suravidl-extension-chrome.crx | grep -q "Cr24"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            suravidl-extension-chrome.crx
            suravidl-extension-firefox.xpi
            suravidl-extension-chrome.zip
            suravidl-extension-firefox-src.zip

  publish:
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
