name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: suravidl
            files: suravidl-linux-x64.AppImage
          - os: windows-2022
            binary: suravidl.exe
            files: |
              suravidl-windows-x64.exe
              suravidl-windows-x64-setup.exe
          - os: macos-14
            binary: suravidl
            files: |
              suravidl-macos-arm64.dmg
              suravidl-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install . pyinstaller pystray pillow pywebview curl_cffi
      - name: Build macOS app icon
        if: matrix.os == 'macos-14'
        run: |
          mkdir -p app.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/logo.png --out app.iconset/icon_${s}x${s}.png 2>/dev/null || {
              mkdir -p app.iconset
              sips -z $s $s assets/logo.png --out app.iconset/icon_${s}x${s}.png
            }
          done
          sips -z 1024 1024 assets/logo.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/icon.icns
      - name: Patch spec icon (macOS)
        if: matrix.os == 'macos-14'
        run: sed -i '' 's#assets/logo.png#assets/icon.icns#' suravidl.spec
      - name: Build binary
        run: pyinstaller suravidl.spec --noconfirm
      - name: Ad-hoc sign (macOS arm64 needs it to run)
        if: matrix.os == 'macos-14'
        run: |
          codesign --force -s - dist/suravidl
          codesign --force -s - --deep dist/suravidl.app
      - name: Smoke test frozen binary
        env:
          SURAVIDL_EXPECT_IMPERSONATE: "1"
        run: ./dist/${{ matrix.binary }} --selftest --download-dir ./smoke_dl
      - name: Package
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            ubuntu-22.04)
              cp dist/suravidl suravidl-linux-x64
              sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools
              ./scripts/build_appimage.sh dist/suravidl suravidl-linux-x64.AppImage
              ;;
            macos-14)
              cp dist/suravidl suravidl-macos-arm64
              mkdir -p dmg_stage
              cp -R dist/suravidl.app dmg_stage/
              ln -s /Applications dmg_stage/Applications
              hdiutil create -volname suravidl -srcfolder dmg_stage \
                -ov -format UDZO suravidl-macos-arm64.dmg
              # the self-update carrier: a zip of the very same .app
              ditto -c -k --keepParent dist/suravidl.app suravidl-macos-arm64.zip
              ;;
            windows-2022)
              cp dist/suravidl.exe suravidl-windows-x64.exe
              ;;
          esac
      - name: Dry-run the self-update swap (macOS only)
        if: matrix.os == 'macos-14'
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/installed/suravidl.app/Contents" \
                   "$WORK/new/suravidl.app/Contents"
          echo old > "$WORK/installed/suravidl.app/Contents/OLD"
          echo new > "$WORK/new/suravidl.app/Contents/NEW"
          # a real ditto zip of a fake bundle — the shape the feed ships
          ditto -c -k --keepParent "$WORK/new/suravidl.app" "$WORK/update.zip"
          SURAVIDL_APPLY_DRYRUN=1 bash src/suravidl_engine/macos_swap.sh \
            suravidl-apply "$WORK/installed/suravidl.app" "$WORK/update.zip" 999999
          test -f "$WORK/installed/suravidl.app/Contents/NEW"
          test ! -e "$WORK/installed/suravidl.app/Contents/OLD"
          test ! -e "$WORK/update.zip"     # the carrier is consumed (v0.42.1)
          echo "swap dry-run ok"
          # a lingering old process (the v0.46.3 field report) must be
          # reaped — politely then firmly — before the reopen; the guard
          # checks the pid still IS the app by its executable name
          mkdir -p "$WORK/fake.app/Contents/MacOS"
          cp /bin/sleep "$WORK/fake.app/Contents/MacOS/suravidl-linger"
          cat > "$WORK/fake.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>suravidl-linger</string>
          </dict></plist>
          PLIST
          mkdir -p "$WORK/new2/suravidl.app/Contents"
          echo new > "$WORK/new2/suravidl.app/Contents/NEW"
          ditto -c -k --keepParent "$WORK/new2/suravidl.app" "$WORK/update2.zip"
          "$WORK/fake.app/Contents/MacOS/suravidl-linger" 300 &
          LINGER=$!
          SURAVIDL_APPLY_DRYRUN=1 SURAVIDL_APPLY_WAIT_TICKS=4 \
            bash src/suravidl_engine/macos_swap.sh \
            suravidl-apply "$WORK/installed/suravidl.app" "$WORK/update2.zip" "$LINGER"
          # a zombie is dead (macOS's bash reaps lazily; kill -0 would lie)
          ST="$(ps -p "$LINGER" -o stat= 2>/dev/null || true)"
          case "$ST" in
            ""|Z*) echo "the lingering process was ended (state: ${ST:-gone})" ;;
            *) echo "the lingering process is genuinely alive ($ST) — it must not be" >&2
               exit 1 ;;
          esac
          wait "$LINGER" 2>/dev/null || true   # reap it before moving on
          test -f "$WORK/installed/suravidl.app/Contents/NEW"
          echo "linger dry-run ok"
          # rollback: a zip carrying no bundle must leave the app untouched
          echo nope > "$WORK/notanapp.txt"
          ditto -c -k "$WORK/notanapp.txt" "$WORK/bad.zip"
          if SURAVIDL_APPLY_DRYRUN=1 bash src/suravidl_engine/macos_swap.sh \
               suravidl-apply "$WORK/installed/suravidl.app" "$WORK/bad.zip" 999999; then
            echo "the rollback path returned success — it must not" >&2
            exit 1
          fi
          test -f "$WORK/installed/suravidl.app/Contents/NEW"
          test -f "$WORK/bad.zip"          # a failed swap keeps the carrier
          echo "rollback dry-run ok"
      - name: Build Windows installer
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          # ref names can come from a branch or dispatch; they reach the
          # shell via the environment, never by interpolation (v0.43.2)
          REF_NAME: ${{ github.ref_name }}
        run: |
          # pwsh keeps /D flags unmangled (msys would rewrite them)
          $version = $env:REF_NAME -replace '^v', ''
          if (-not $version) { $version = '0.0.0' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') {
              $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            } else {
              $iscc = 'ISCC.exe'
            }
          }
          & $iscc "/DAppVersion=$version" packaging/windows/suravidl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -Force packaging/windows/Output/suravidl-setup.exe suravidl-windows-x64-setup.exe
      - name: Smoke the Windows update chain
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          # the chain the app spawns for Restart & Install, executed for real
          # on a real Windows machine against the setup this job just built
          # (v0.45.9): wait-for-pid -> silent install -> cleanup -> log trail
          python scripts/smoke_windows_update.py "$env:GITHUB_WORKSPACE\suravidl-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}

  extension:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Firefox .xpi + load-unpacked zips
        run: |
          set -e
          # Firefox build dir: MV2 manifest + shared files
          rm -rf /tmp/ffext && cp -r extension /tmp/ffext
          # the shop window is not the workshop: the test harness and the
          # other browser's manifest stay out of both submitted packages
          rm -rf /tmp/ffext/firefox /tmp/ffext/test_harness.mjs
          cp extension/firefox/manifest.json /tmp/ffext/manifest.json
          # unsigned xpi (stable Firefox needs an AMO-signed build to install)
          (cd /tmp/ffext && zip -qr "$OLDPWD/suravidl-extension-firefox.xpi" .)
          # load-unpacked convenience zips (Chrome blocks off-store .crx since
          # ~2019 — the packed .crx release was dropped in v0.38.2)
          (cd extension && zip -qr "$OLDPWD/suravidl-extension-chrome.zip" . \
              -x "firefox/*" -x "test_harness.mjs")
          (cd /tmp/ffext && zip -qr "$OLDPWD/suravidl-extension-firefox-src.zip" .)
      - uses: actions/upload-artifact@v6
        with:
          name: extension
          path: |
            suravidl-extension-firefox.xpi
            suravidl-extension-chrome.zip
            suravidl-extension-firefox-src.zip

  publish:
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write        # the android dispatch below needs it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - name: Write the update manifest (version.json + SHA256SUMS)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/generate_release_manifest.py dist \
              --tag "$REF_NAME" --repo "${{ github.repository }}"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      # The release was created with GITHUB_TOKEN: events it produces do not
      # start other workflows (GitHub's anti-recursion rule) -- except
      # workflow_dispatch, which is exactly this call. The android run then
      # puts the APK on the tag and folds it into version.json.
      - name: Dispatch the Android attach on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run android.yml --ref "$REF_NAME"
