name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: suravidl
            zip: suravidl-linux-x64.zip
            raw: suravidl-linux-x64
          - os: windows-2022
            binary: suravidl.exe
            zip: suravidl-windows-x64.zip
            raw: suravidl-windows-x64.exe
          - os: macos-14
            binary: suravidl
            zip: suravidl-macos-arm64.zip
            raw: suravidl-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install . pyinstaller pystray pillow
      - name: Build macOS app icon
        if: matrix.os == 'macos-14'
        run: |
          mkdir -p app.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/logo.png --out app.iconset/icon_${s}x${s}.png 2>/dev/null || {
              mkdir -p app.iconset
              sips -z $s $s assets/logo.png --out app.iconset/icon_${s}x${s}.png
            }
          done
          sips -z 1024 1024 assets/logo.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/icon.icns
      - name: Patch spec icon (macOS)
        if: matrix.os == 'macos-14'
        run: sed -i '' 's#assets/logo.png#assets/icon.icns#' suravidl.spec
      - name: Build binary
        run: pyinstaller suravidl.spec --noconfirm
      - name: Ad-hoc sign (macOS arm64 needs it to run)
        if: matrix.os == 'macos-14'
        run: codesign --force -s - dist/suravidl
      - name: Smoke test frozen binary
        run: ./dist/${{ matrix.binary }} --selftest --download-dir ./smoke_dl
      - name: Package
        shell: bash
        run: |
          cd dist
          cp ${{ matrix.binary }} ../${{ matrix.raw }}
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            7z a ../${{ matrix.zip }} suravidl.exe || zip ../${{ matrix.zip }} suravidl.exe
          else
            zip ../${{ matrix.zip }} suravidl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            ${{ matrix.raw }}
            ${{ matrix.zip }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
