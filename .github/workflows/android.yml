name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK (bundles engine + yt-dlp via Chaquopy)
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: suravidl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/suravidl-release.keystore
          echo "ANDROID_KEYSTORE_FILE=/tmp/suravidl-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Verify 16 KB page size compatibility
        run: |
          set -e
          APK=$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk
          BT=$ANDROID_HOME/build-tools/35.0.0
          echo "--- zipalign (uncompressed .so must be 16 KB aligned in the APK) ---"
          $BT/zipalign -c -P 16 -v 4 "$APK"
          echo "--- ELF LOAD segment alignment (must be 0x4000) ---"
          mkdir -p /tmp/apk16k && cd /tmp/apk16k && rm -rf lib
          unzip -q -o "$APK" 'lib/*'
          FAIL=0
          for so in $(find lib -name '*.so' | sort); do
            aligns=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            echo "$so -> LOAD align: $aligns"
            for a in $aligns; do
              if [ "$a" != "0x4000" ]; then echo "::error file=$so::LOAD segment not 16 KB aligned ($a)"; FAIL=1; fi
            done
          done
          [ "$FAIL" = "0" ] && echo "16 KB page size compatible"
      - uses: actions/upload-artifact@v4
        with:
          name: suravidl-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  attach-apk:
    runs-on: ubuntu-latest
    needs: release-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: suravidl-release-apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Start fixture server (reached by emulator at 10.0.2.2:8801)
        run: nohup python3 -m http.server 8801 --directory tests/fixtures > /tmp/fixture.log 2>&1 &
      - name: Grant KVM access (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run engine download test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/androidTests/

  # Reproduces the user's device class: Android 15 with 16 KB memory pages.
  # The full app-startup path (MainActivity -> EngineService -> Chaquopy ->
  # /health) must boot a real 16 KB page size environment.
  instrumentation-16k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Start fixture server (reached by emulator at 10.0.2.2:8801)
        run: nohup python3 -m http.server 8801 --directory tests/fixtures > /tmp/fixture.log 2>&1 &
      - name: Grant KVM access (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install a 16 KB page size emulator image
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --list > /tmp/sdklist.txt 2>&1 || true
          echo "--- candidate 16 KB system images ---"
          grep -iE "system-images;android-(35|36)[^ ]*x86_64" /tmp/sdklist.txt | sed 's/|.*//' | sort -u | head -40 || true
          IMG=$(grep -oE "system-images;android-(35|36);[A-Za-z0-9_.]*ps16k[A-Za-z0-9_.]*;x86_64" /tmp/sdklist.txt | sort -u | tail -1)
          if [ -z "$IMG" ]; then
            IMG=$(grep -oE "system-images;android-(35|36);[A-Za-z0-9_.]*16k[A-Za-z0-9_.]*;x86_64" /tmp/sdklist.txt | sort -u | tail -1)
          fi
          if [ -z "$IMG" ]; then echo "::error::no 16 KB page size system image found"; exit 1; fi
          echo "using $IMG"
          echo "SYSIMG=$IMG" >> "$GITHUB_ENV"
          sdkmanager "$IMG" emulator platform-tools > /dev/null
      - name: Boot the 16 KB emulator
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          echo no | avdmanager create avd -n suravidl16k -k "$SYSIMG" --force
          nohup emulator -avd suravidl16k -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > /tmp/emu.log 2>&1 &
          adb wait-for-device
          timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          echo "device page size: $(adb shell getconf PAGESIZE)"
          adb shell getprop ro.build.version.sdk
      - name: Run full app + engine tests on 16 KB emulator
        run: gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Collect crash evidence
        if: failure()
        run: |
          mkdir -p ci-artifacts
          adb shell "find /sdcard/Android/data/com.suravidl.app -name '*.txt' 2>/dev/null" || true
          adb pull /sdcard/Android/data/com.suravidl.app/files/logs ci-artifacts/applogs 2>/dev/null || true
          adb logcat -d -b crash > ci-artifacts/crashbuf.txt 2>/dev/null || true
          adb logcat -d > ci-artifacts/logcat.txt 2>/dev/null || true
      - name: Upload report + crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16k-report
          path: |
            android/app/build/reports/androidTests/
            ci-artifacts/
          if-no-files-found: ignore