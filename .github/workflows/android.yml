name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK (bundles engine + yt-dlp via Chaquopy)
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: suravidl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/suravidl-release.keystore
          echo "ANDROID_KEYSTORE_FILE=/tmp/suravidl-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Verify 16 KB page size compatibility
        run: |
          set -e
          APK=$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk
          BT=$ANDROID_HOME/build-tools/35.0.0
          echo "--- zipalign (uncompressed .so must be 16 KB aligned in the APK) ---"
          $BT/zipalign -c -P 16 -v 4 "$APK"
          echo "--- ELF LOAD segment alignment (must be 0x4000) ---"
          mkdir -p /tmp/apk16k && cd /tmp/apk16k && rm -rf lib
          unzip -q -o "$APK" 'lib/*'
          FAIL=0
          for so in $(find lib -name '*.so' | sort); do
            aligns=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            echo "$so -> LOAD align: $aligns"
            for a in $aligns; do
              if [ "$a" != "0x4000" ]; then echo "::error file=$so::LOAD segment not 16 KB aligned ($a)"; FAIL=1; fi
            done
          done
          [ "$FAIL" = "0" ] && echo "16 KB page size compatible"
      - uses: actions/upload-artifact@v4
        with:
          name: suravidl-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  attach-apk:
    runs-on: ubuntu-latest
    needs: release-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: suravidl-release-apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Start fixture server (reached by emulator at 10.0.2.2:8801)
        run: nohup python3 -m http.server 8801 --directory tests/fixtures > /tmp/fixture.log 2>&1 &
      - name: Grant KVM access (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run engine download test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/androidTests/

  # Reproduces the user's device class: Android 15 with 16 KB memory pages.
  # The full app-startup path (MainActivity -> EngineService -> Chaquopy ->
  # /health) must boot a real 16 KB page size environment.
  instrumentation-16k:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Start fixture server (reached by emulator at 10.0.2.2:8801)
        run: nohup python3 -m http.server 8801 --directory tests/fixtures > /tmp/fixture.log 2>&1 &
      - name: Grant KVM access (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run full app + engine tests on a 16 KB page size emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          script: |
            echo "device page size: $(adb shell getconf PAGESIZE)"
            gradle -p android connectedDebugAndroidTest --no-daemon
            STATUS=$?
            mkdir -p ci-artifacts
            adb install -r -t android/app/build/outputs/apk/debug/app-debug.apk || true
            adb shell pm grant com.suravidl.app android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.suravidl.app/.MainActivity || true
            sleep 45
            adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus" > ci-artifacts/focus.txt || true
            adb exec-out screencap -p > ci-artifacts/app-screen.png || true
            adb logcat -d -t 300 > ci-artifacts/app-logcat.txt || true
            ls -la ci-artifacts
            exit $STATUS
      - name: Collect crash evidence
        if: failure()
        run: |
          mkdir -p ci-artifacts
          adb shell "find /sdcard/Android/data/com.suravidl.app -name '*.txt' 2>/dev/null" || true
          adb pull /sdcard/Android/data/com.suravidl.app/files/logs ci-artifacts/applogs 2>/dev/null || true
          adb logcat -d -b crash > ci-artifacts/crashbuf.txt 2>/dev/null || true
          adb logcat -d > ci-artifacts/logcat.txt 2>/dev/null || true
      - name: Upload report + crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16k-report
          path: |
            android/app/build/reports/androidTests/
            ci-artifacts/
          if-no-files-found: ignore