name: wsprobe (spawn probe — temporary)

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe detached-PowerShell spawn modes
        run: python scripts/probe_windows_spawn.py
