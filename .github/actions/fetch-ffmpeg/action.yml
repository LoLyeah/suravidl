name: fetch-ffmpeg
description: >
  Download the bundled static ffmpeg binaries (built by ffmpeg-android.yml,
  published on the `ffmpeg-bin` release) into the Android jniLibs so the APK
  ships a working ffmpeg for audio extraction and merging.

runs:
  using: composite
  steps:
    - name: Download + verify ffmpeg
      shell: bash
      run: |
        set -euo pipefail
        BASE="https://github.com/LoLyeah/suravidl/releases/download/ffmpeg-bin"
        cd "$RUNNER_TEMP"
        curl -fsSL -o libffmpeg-arm64-v8a.so  "$BASE/libffmpeg-arm64-v8a.so"
        curl -fsSL -o libffmpeg-x86_64.so     "$BASE/libffmpeg-x86_64.so"
        curl -fsSL -o libffprobe-arm64-v8a.so "$BASE/libffprobe-arm64-v8a.so"
        curl -fsSL -o libffprobe-x86_64.so    "$BASE/libffprobe-x86_64.so"
        # Verify against the digests COMMITTED beside this action, not the
        # release's own SHA256SUMS.txt — that file is regenerable by whoever
        # can rewrite the binaries, so it proves nothing (v0.43.2 audit).
        # Bump checksums.txt in a commit whenever ffmpeg-bin is republished.
        sha256sum -c "$GITHUB_ACTION_PATH/checksums.txt"
        DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs"
        mkdir -p "$DEST/arm64-v8a" "$DEST/x86_64"
        cp libffmpeg-arm64-v8a.so  "$DEST/arm64-v8a/libffmpeg.so"
        cp libffmpeg-x86_64.so     "$DEST/x86_64/libffmpeg.so"
        cp libffprobe-arm64-v8a.so "$DEST/arm64-v8a/libffprobe.so"
        cp libffprobe-x86_64.so    "$DEST/x86_64/libffprobe.so"
        echo "--- bundled ffmpeg + ffprobe:"
        ls -l "$DEST/arm64-v8a/libffmpeg.so" "$DEST/arm64-v8a/libffprobe.so" \
              "$DEST/x86_64/libffmpeg.so"    "$DEST/x86_64/libffprobe.so"
        file "$DEST/arm64-v8a/libffmpeg.so" "$DEST/arm64-v8a/libffprobe.so"
