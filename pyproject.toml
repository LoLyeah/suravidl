[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suravidl-engine"
version = "0.32.0"
description = "suravidl engine - universal web video downloader engine (yt-dlp wrapper API)"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "curl_cffi"]
# browser impersonation for sites with strict bot checks (e.g. Facebook):
#   pip install -e '.[impersonate]'
impersonate = ["curl_cffi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suravidl_engine = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
