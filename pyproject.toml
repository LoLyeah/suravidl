[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suravidl-engine"
# read from suravidl_engine.__version__: a hardcoded copy went stale at 0.43.1
dynamic = ["version"]
description = "suravidl engine - universal web video downloader engine (yt-dlp wrapper API)"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "fastapi", "uvicorn[standard]"]

[tool.setuptools.dynamic]
version = {attr = "suravidl_engine.__version__"}

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "httpx", "curl_cffi"]
# browser impersonation for sites with strict bot checks (e.g. Facebook):
#   pip install -e '.[impersonate]'
impersonate = ["curl_cffi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suravidl_engine = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
