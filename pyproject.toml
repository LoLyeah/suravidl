[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suravidl-engine"
# read from suravidl_engine.__version__: a hardcoded copy went stale at 0.43.1
dynamic = ["version"]
description = "suravidl engine - universal web video downloader engine (yt-dlp wrapper API)"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "fastapi", "uvicorn[standard]"]

[tool.setuptools.dynamic]
version = {attr = "suravidl_engine.__version__"}

[project.optional-dependencies]
# curl_cffi bundles libcurl AND a static Brotli decoder. 0.16.3 ships
# Brotli 1.2.0 (CVE-2026-111497, "Node2Shell"); 0.17.0 ships the fixed
# 1.2.1 — but yt-dlp 2026.10.21 refuses 0.17.x outright ("Only curl_cffi
# versions 0.5.10 and 0.10.x through 0.16.x are supported"), which kills
# impersonation entirely. Until yt-dlp accepts 0.17, the cap is 0.16: a
# working feature with the exposure documented in docs/SECURITY.md.
dev = ["pytest", "pytest-xdist", "httpx", "curl_cffi>=0.16,<0.17"]
# browser impersonation for sites with strict bot checks (e.g. Facebook):
#   pip install -e '.[impersonate]'
impersonate = ["curl_cffi>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suravidl_engine = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
